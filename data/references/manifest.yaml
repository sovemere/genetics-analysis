# Reference corpus manifest -- roadmap M2.1, M2.3, M2.4.
#
# READ THIS BEFORE ADDING A SOURCE
# ================================
# The manifest is COMMITTED. The payloads it describes are NOT (AGENTS.md 1.4, 5.5).
# `data/references/**` is gitignored with this file and manifest.lock explicitly
# re-included; do not weaken that.
#
# A source names its licence, it does not describe one. `license:` is resolved against
# genetics/refs/licenses.py, which is where the properties live. An id that module does
# not know refuses to load rather than defaulting to permissive -- so adding a source
# under an unfamiliar licence means reading the terms and writing an entry there, which
# is a diff a reviewer will actually see.
#
# Every URL, size and digest below was verified against the live server on 2026-08-15 or
# 2026-08-16.
# Nothing here was written from memory. Where a publisher provides a checksum -- NCBI's
# .md5 sidecars, the base64 md5 Google Cloud Storage returns in `x-goog-hash` -- it is
# recorded as `md5:`. Where a file is small enough to have been downloaded and hashed
# during authoring, it carries a real `sha256:`. Where a publisher serves only a rolling
# "latest" URL, no honest digest exists and the file carries `unpinned_reason:` instead;
# the fetcher records what actually arrived in manifest.lock, which is committed, so the
# first fetch pins it for everyone afterwards.
#
# Sizes are exact Content-Length values, not estimates. They are large on purpose: see
# the note on gnomAD below.

schema_version: 1

sources:
  # --------------------------------------------------------------------------
  # Monogenic health (M7). Cheap, and the frequency gate in AGENTS.md 4.1 exists
  # precisely because these calls are unreliable -- ClinVar says what a variant means,
  # gnomAD says how much to believe the chip about it.
  # --------------------------------------------------------------------------
  - id: clinvar_grch37
    name: ClinVar GRCh37 VCF and variant summary
    tier: A
    required: true
    version: "2026-08-04"
    homepage: https://www.ncbi.nlm.nih.gov/clinvar/
    license: LicenseRef-US-Government-Public-Domain
    enables:
      - ClinVar variant lookup (M7.1)
      - ACMG secondary-finding surfacing (M7.4)
      - array coverage honesty card (M7.6)
      - GRCh37/GRCh38 build anchors (M1.5)
    notes: >-
      The dated archive release is pinned rather than the weekly clinvar.vcf.gz, because
      a rolling filename cannot be checksummed and a saved run has to stay interpretable
      after the archive moves on (AGENTS.md 5.5). variant_summary.txt.gz has no dated
      equivalent, so it is the one unpinned file here.
    post_process:
      - step: extract_build_anchors
        params:
          input: variant_summary.txt.gz
          output: build_anchors.json
          count: 200
    files:
      - url: https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh37/archive_2.0/2026/clinvar_20260804.vcf.gz
        filename: clinvar_20260804.vcf.gz
        size_bytes: 193086366
        md5: 425dceceab4e142647461c09bbe2d35c
      - url: https://ftp.ncbi.nlm.nih.gov/pub/clinvar/tab_delimited/variant_summary.txt.gz
        filename: variant_summary.txt.gz
        size_bytes: 441836319
        unpinned_reason: "variant_summary.txt.gz is regenerated weekly under a fixed name; the dated VCF above is the pinned artifact"

  # --------------------------------------------------------------------------
  # dbSNP fills M1.7's rsID merge table and supplies M3.5's authoritative GRCh37 variant
  # index. M1.5's dual-build anchors come from ClinVar variant_summary above: a
  # single-assembly VCF cannot establish coordinates on a second assembly.
  # --------------------------------------------------------------------------
  - id: dbsnp_b157_grch37
    name: dbSNP build 157, GRCh37.p13 VCF
    tier: A
    required: true
    version: b157
    homepage: https://www.ncbi.nlm.nih.gov/snp/
    license: LicenseRef-US-Government-Public-Domain
    enables:
      - rsID merge-chain resolution (M1.7)
      - authoritative rsID/GRCh37 coordinate/allele validation (M3.5)
    notes: >-
      Fetched from the build-pinned archive path rather than latest_release/, which
      silently becomes b158. The publisher's md5 sidecar is identical at both paths, which
      was checked rather than assumed.
    post_process:
      - step: extract_rsid_merge_table
        params:
          input: refsnp-merged.json.bz2
          output: rsid_merges.parquet
          unresolvable_output: rsid_unresolvable.parquet
      - step: extract_dbsnp_variant_index
        params:
          input: GCF_000001405.25.gz
          output: dbsnp_variants.parquet
    files:
      - url: https://ftp.ncbi.nlm.nih.gov/snp/archive/b157/VCF/GCF_000001405.25.gz
        filename: GCF_000001405.25.gz
        size_bytes: 28194800139
        md5: 35db22bcd166f904e4775dbbc29f5965
      - url: https://ftp.ncbi.nlm.nih.gov/snp/archive/b157/JSON/refsnp-merged.json.bz2
        filename: refsnp-merged.json.bz2
        size_bytes: 813797312
        md5: 5d9c56c9b8c3412eb0195a63f12e1ebf

  # --------------------------------------------------------------------------
  # gnomAD is load-bearing (AGENTS.md 4.1, 5.1): the frequency-based confidence
  # inversion cannot be computed without it, and that inversion is the single most
  # important thing this project has to get right.
  #
  # TWO ENTRIES, AND WHY. gnomAD v4 is GRCh38-only; everything in this pipeline is
  # GRCh37, so the GRCh37 release is v2.1.1 -- note AGENTS.md 5.1 cites v4's variant
  # counts, which describe a build we cannot use without lifting over.
  #
  # The exomes are one 63 GB file and cover the coding regions where essentially all
  # ClinVar pathogenic assertions live, so they are what the 4.1 gate actually needs and
  # they are `required`. The genomes are 495 GB across 23 files and buy non-coding
  # allele frequencies for trait and PRS cards; real, useful, and not worth making a
  # fresh checkout download half a terabyte before it can do anything, so they are
  # optional. AGENTS.md 0.1C says compute cost is not a constraint, and this manifest
  # honours that by stating the true number rather than by hiding it behind a default.
  # --------------------------------------------------------------------------
  - id: gnomad_exomes_r2_1_1_grch37
    name: gnomAD v2.1.1 exomes sites VCF (GRCh37)
    tier: A
    required: true
    version: r2.1.1
    homepage: https://gnomad.broadinstitute.org/downloads
    license: LicenseRef-gnomAD-Open-Access
    enables:
      - rare-variant frequency gate (M7.2) -- the AGENTS.md 4.1 requirement
      - empirical PPV band on likely-artifact cards (M7.3)
    post_process:
      - step: subset_vcf_to_array_positions
        params:
          output: gnomad_exomes_af_array_positions.parquet
          info_fields: AF,AF_popmax,AN,AC,nhomalt
    files:
      - url: https://storage.googleapis.com/gcp-public-data--gnomad/release/2.1.1/vcf/exomes/gnomad.exomes.r2.1.1.sites.vcf.bgz
        filename: gnomad.exomes.r2.1.1.sites.vcf.bgz
        size_bytes: 63145056967
        md5: f034173bf6e57fbb5e8ce680e95134f2

