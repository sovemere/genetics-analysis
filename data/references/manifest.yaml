      retention: >-
        Terms forbid building a derivative database or redistributing data without a Johns
        Hopkins licence, and require weekly refresh. Cache for at most seven days, never
        vendor, and never fold OMIM text into a committed card -- cite it instead.
    notes: >-
      AGENTS.md 4.8 trap 3. The licence classification here is no-derivatives and
      non-commercial, so the gate refuses this source without an explicit opt-in on top
      of the manual step.

