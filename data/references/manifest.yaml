        Register for an OMIM API key and set OMIM_API_KEY in the environment. The key is
        never written to the lock, never logged and never committed. OMIM is an
        enrichment, not a dependency -- AGENTS.md 5.2 notes most of its practical value is
        recoverable from ClinVar, ClinGen, MedGen and Orphanet, all of which are tier A.
      url: https://www.omim.org/api
