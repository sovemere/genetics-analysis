        TT: no_ivs4
        AT: one_ivs4
        AA: two_ivs4
    outcomes:
      no_ivs4:
        evidence: null
        summary: "No IVS4+4A>T copy is indicated at this marker. This is not a negative Fanconi anaemia carrier screen."
        detail: >-
          IVS4+4A>T is the FANCC allele Ashkenazi carrier screening tests for. A no-copy
          result here leaves other FANCC variants and the other Fanconi anaemia genes
          unexamined.
        risk_context: >-
          Scott 2010: Fanconi anaemia group C carrier frequency was 1 in 100 among fully
          Ashkenazi Jewish screenees; Gregg 2021 gives a maximum FANCC carrier frequency of
          0.012 (about 1 in 83) across gnomAD populations. No residual carrier risk is
          computed from one marker.
      one_ivs4:
        summary: "The chip pattern is consistent with one IVS4+4A>T copy, a Fanconi anaemia group C allele. One copy is a carrier state and does not cause Fanconi anaemia."
        detail: >-
          IVS4+4A>T changes the fourth base of FANCC intron 4, near a splice donor. Scott
          2010 found it in 66 of 6,620 fully Ashkenazi Jewish screenees (1 in 100); the
          other FANCC allele tested, c.67delG, was found in none of 914. ClinVar classifies it pathogenic with multiple concordant submitters.
        risk_context: >-
          If a reproductive partner also carries a FANCC allele, each pregnancy has a 1 in 4
          chance of a child with two (Mendelian expectation). Scott 2010 monitored one
          Fanconi anaemia carrier-couple pregnancy, too few for an empirical rate. No
          partner's status is known here; no offspring risk is computed.
      two_ivs4:
        evidence: null
        summary: "The chip pattern is consistent with two IVS4+4A>T copies, a Fanconi anaemia genotype. A two-copy call of an allele this rare is more often a genotyping error."
        detail: >-
          Fanconi anaemia usually presents in childhood with bone-marrow failure or
          congenital differences. A two-copy call in someone without that diagnosis is
          more likely a measurement problem; only clinical testing establishes it.
        risk_context: >-
          This card assigns no penetrance or outcome estimate to a two-copy call. Every
          child of a two-copy parent inherits one copy; whether a child is affected depends
          on the other parent's FANCC alleles.
    evidence:
      tier: cohort
      replication: independent
      sample_size: 6620
      ancestry: [EUR]
      effect:
        measure: proportion
        value: 0.01
        context: "IVS4+4A>T carriers among 6,620 fully Ashkenazi Jewish screenees in New York (66; Scott 2010); a carrier prevalence, not an effect on the carrier. The 1000 Genomes vocabulary has no Ashkenazi category."
    citations:
      - type: doi
        id: 10.1002/humu.21327
        title: Experience with carrier screening and prenatal diagnosis for 16 Ashkenazi Jewish genetic diseases
        note: "Tables 1, 2 and 5: Ashkenazi carrier frequencies and carrier-couple pregnancy outcomes."
      - type: doi
        id: 10.1038/s41436-021-01203-z
        title: "Screening for autosomal recessive and X-linked conditions during pregnancy and preconception: a practice resource of the American College of Medical Genetics and Genomics (ACMG)"
        note: "Table 2: maximum gnomAD carrier frequency per gene."
