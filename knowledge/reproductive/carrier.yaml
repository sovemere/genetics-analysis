          K304E impairs folding of medium-chain acyl-CoA dehydrogenase, a fatty-acid
          oxidation enzyme. Among 62 US newborns found by tandem mass spectrometry screening
          of 930,078 blood spots, 39 had two copies, 21 one and 2 none: 99 of 124 disease
          alleles (Andresen 2001). About 80% of clinically diagnosed patients in earlier
          series had two copies.
        risk_context: >-
          If a reproductive partner also carries an MCAD deficiency allele, each pregnancy
          has a 1 in 4 chance of a child with two (Mendelian expectation). Andresen 2001
          observed MCAD deficiency in 1 of 15,001 screened US newborns. No partner's status
          is known here; no offspring risk is computed.
      two_k304e:
        evidence: null
        summary: "The chip pattern is consistent with two K304E copies, the commonest MCAD deficiency genotype. A two-copy call can be a genotyping error."
        detail: >-
          Andresen 2001 notes that undiagnosed affected people may remain without symptoms
          for decades, possibly for life, so a two-copy call in a healthy adult is not
          contradictory in itself. Only biochemical or clinical DNA testing establishes it.
        risk_context: >-
          This card assigns no penetrance or outcome estimate to a two-copy call. Every
