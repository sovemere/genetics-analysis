    gene: FANCC
    carrier:
      condition: Fanconi anaemia, complementation group C
      inheritance: autosomal_recessive
      variant: "FANCC c.456+4A>T, legacy IVS4+4A>T"
      pathogenic_allele: A
      clinvar: 12045
      typed_scope: >-
        This card types IVS4+4A>T only. Other FANCC variants, and the other Fanconi anaemia
        genes, are not typed by this report.
    match:
      strand: forward_only
      variants:
        - rsid: rs104886456
          chrom: "9"
          pos_grch37: 97934315
