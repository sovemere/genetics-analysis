      sample_size: 62
      ancestry: [UNKNOWN]
      effect:
        measure: proportion
        value: 0.798
        context: "99 of 124 disease alleles in 62 MCAD-deficient US newborns found by tandem mass spectrometry screening were K304E (Andresen 2001); a case composition, not a risk for carriers. Population ancestry was not reported."
