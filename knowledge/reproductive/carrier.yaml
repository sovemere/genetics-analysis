          Ashkenazi screenees in Scott 2010. A no-copy result here leaves Y231X and the
          other ASPA variants unexamined.
        risk_context: >-
          Scott 2010: Canavan carrier frequency was 1 in 55 among fully Ashkenazi Jewish
          screenees across the tested alleles; Gregg 2021 gives a maximum ASPA carrier
          frequency of 0.0199 (about 1 in 50) across gnomAD populations. No residual carrier
          risk is computed from one marker.
      one_e285a:
        summary: "The chip pattern is consistent with one E285A copy, a Canavan disease allele. One copy is a carrier state and does not cause Canavan disease."
        detail: >-
          E285A is a missense variant in aspartoacylase. Scott 2010 found it in 1 in 66 of
          8,793 fully Ashkenazi Jewish screenees. ClinVar classifies it pathogenic or likely
          pathogenic with multiple concordant submitters.
        risk_context: >-
          If a reproductive partner also carries a Canavan allele, each pregnancy has a 1 in
          4 chance of a child with two (Mendelian expectation). Scott 2010 observed 6
          affected of 28 DNA-confirmed Canavan carrier-couple pregnancies. No partner's
          status is known here; no offspring risk is computed.
      two_e285a:
        evidence: null
        summary: "The chip pattern is consistent with two E285A copies, a Canavan genotype. A two-copy call of an allele this rare is almost certainly a genotyping error in a healthy adult."
        detail: >-
          Canavan disease is a severe leukodystrophy that presents in infancy. A two-copy
          call in a healthy adult is far more likely a measurement problem than the disease;
          only clinical testing establishes it.
        risk_context: >-
          This card assigns no penetrance or outcome estimate to a two-copy call. Every
          child of a two-copy parent would inherit one copy; whether a child is affected
          depends on the other parent's ASPA alleles.
    evidence:
      tier: cohort
      replication: independent
      sample_size: 8793
      ancestry: [EUR]
      effect:
        measure: proportion
        value: 0.0152
        context: "E285A carriers among 8,793 fully Ashkenazi Jewish screenees in New York (134; Scott 2010); a carrier prevalence, not an effect on the carrier. The 1000 Genomes vocabulary has no Ashkenazi category."
    citations:
      - type: doi
        id: 10.1002/humu.21327
        title: Experience with carrier screening and prenatal diagnosis for 16 Ashkenazi Jewish genetic diseases
        note: "Tables 1, 2 and 5: Ashkenazi carrier frequencies and carrier-couple pregnancy outcomes."
      - type: doi
        id: 10.1038/s41436-021-01203-z
        title: "Screening for autosomal recessive and X-linked conditions during pregnancy and preconception: a practice resource of the American College of Medical Genetics and Genomics (ACMG)"
        note: "Table 1: maximum gnomAD carrier frequency per gene."
    caveats:
      - "Ashkenazi carrier frequencies describe the New York screening cohort, not this person's ancestry."

  - id: fancc_ivs4_4a_t_carrier
    section: reproductive
    kind: interpretation
