schema_version: 7
# M11.5 carrier cards. Each types one array SNV with a ClinVar P/LP recessive assertion and
# a usable gnomAD frequency, measured against dbSNP b157 and the AncestryDNA V2.0 marker list
# (docs/carrier_status.md records the audit, including every candidate that failed).
#
# Evidence rule: the carrier outcome uses the card-level evidence, which is either the
# allele's share of disease alleles in a cited patient series (a case composition) or its
# carrier prevalence in a cited screened population; the effect context says which. The
# no-copy and two-copy outcomes assign no phenotype estimate. The couple-level figure is the
# Mendelian expectation; Scott 2010's DNA-confirmed carrier-couple pregnancies are cited for
# it, per condition where that study reports one.
cards:
  - id: hbb_hbs_carrier
    section: reproductive
    kind: interpretation
    title: Sickle haemoglobin (HbS) carrier status
    gene: HBB
    carrier:
      condition: Sickle cell disease
      inheritance: autosomal_recessive
      variant: "HBB c.20A>T (p.Glu7Val), HbS"
      pathogenic_allele: A
      clinvar: 15333
      typed_scope: >-
        This card types HbS only. HbC, HbE and the beta-thalassaemia variants, which cause
        sickle cell disease when inherited with HbS, are not typed by this report.
    match:
      strand: forward_only
      variants:
        - rsid: rs334
          chrom: "11"
          pos_grch37: 5248232
          alleles: [A, T]
      genotypes:
        TT: no_hbs
        AT: one_hbs
        AA: two_hbs
    outcomes:
      no_hbs:
        evidence: null
        summary: "No HbS copy is indicated at this marker. This is not a negative haemoglobinopathy screen."
        detail: >-
          The marker reads the HbS position only. Other beta-globin variants that combine
          with HbS to cause sickle cell disease, and alpha-thalassaemia deletions, are not
          read. A haemoglobin test measures what this card cannot.
        risk_context: >-
          Ojodu 2014: sickle cell trait was found in 73.1 per 1,000 Black newborns, 6.9 per
          1,000 Hispanic newborns and 15.5 per 1,000 newborns overall in US screening in
          2010. No residual carrier risk is computed here: a no-copy result at this marker
          says nothing about the other beta-globin variants.
      one_hbs:
        summary: "The chip pattern is consistent with one HbS copy: sickle cell trait, a carrier state that does not cause sickle cell disease."
        detail: >-
          HbS changes glutamic acid to valine at position 6 of the mature beta-globin chain.
          A carrier makes both normal and sickle haemoglobin. Sickle cell disease needs two
          disease alleles: two HbS copies, or HbS with HbC or a beta-thalassaemia allele.
          The trait itself has reported health associations that this card does not
          evaluate; Naik 2014 is cited for one.
        risk_context: >-
          If a reproductive partner also carries HbS, HbC or a beta-thalassaemia allele,
          each pregnancy has a 1 in 4 chance of a child with sickle cell disease (Mendelian
          expectation). Ojodu 2014: 73.1 per 1,000 Black US newborns carried the trait in
          2010. Piel 2013 estimated 5,476,000 trait and 312,000 HbSS births worldwide in
          2010. No partner's status is known here; no offspring risk is computed.
      two_hbs:
        evidence: null
        summary: "The chip pattern is consistent with two HbS copies (HbSS), the genotype of sickle cell anaemia. An unexpected two-copy call can be a genotyping error."
        detail: >-
          Sickle cell anaemia is usually diagnosed in infancy through newborn screening or
          symptoms. A two-copy call in someone without that diagnosis is more likely a
          measurement problem than an unknown disease. Only a haemoglobin or clinical DNA
          test establishes it. Every child of a person with two HbS copies inherits one.
        risk_context: >-
          This card assigns no penetrance or outcome estimate to HbSS. Piel 2013 estimated
          312,000 HbSS births worldwide in 2010. Each child of a two-copy parent is at least
          a carrier; whether a child is affected depends on the other parent's alleles.
    evidence:
      tier: cohort
      replication: independent
      sample_size: 156732
      ancestry: [AFR]
      effect:
        measure: proportion
        value: 0.0731
        context: "Sickle cell trait in 11,461 of 156,732 Black newborns screened in 13 US states in 2010; a carrier prevalence, not an effect on the carrier."
    citations:
      - type: pmid
        id: "25503918"
        title: Incidence of sickle cell trait--United States, 2010
      - type: doi
        id: 10.1016/S0140-6736(12)61229-X
        title: "Global epidemiology of sickle haemoglobin in neonates: a contemporary geostatistical model-based map and population estimates"
      - type: doi
        id: 10.1001/jama.2014.15063
        title: Association of sickle cell trait with chronic kidney disease and albuminuria in African Americans
        note: "CKD in 239 of 1,247 trait carriers (19.2%) versus 1,994 of 14,722 noncarriers (13.5%); a separate claim about carriers, not evaluated by this card."
      - type: accession
        database: ClinVar
        id: VCV000015333
        title: NM_000518.5(HBB):c.20A>T (p.Glu7Val)
    caveats:
      - "The GRCh37 forward strand reads HbS as A where the reference is T; HBB runs on the reverse strand, so the transcript writes the same change as A>T at c.20. Other bases at this multiallelic site stay unmatched."
      - "A and T are complementary bases, so the strand of a homozygous call cannot be established from the export: no copy and two copies show the same letters, and the card reports that as strand-ambiguous instead of choosing. A heterozygous call is one copy on either strand and is reported."
      - "Newborn-screening trait rates describe the populations screened, not this person's ancestry."

  - id: cftr_g542x_carrier
    section: reproductive
    kind: interpretation
    title: Cystic fibrosis carrier status (CFTR G542X)
    gene: CFTR
    carrier:
      condition: Cystic fibrosis
      inheritance: autosomal_recessive
      variant: "CFTR c.1624G>T (p.Gly542Ter), G542X"
      pathogenic_allele: T
      clinvar: 7115
      typed_scope: >-
        This card types G542X only. F508del, about 72% of non-Hispanic white CF chromosomes,
        is an indel this export cannot resolve; it and most other CFTR variants are not
        typed. Other CFTR markers have their own cards, and together they are not a CF
        carrier screen.
    match:
      strand: forward_only
      variants:
        - rsid: rs113993959
          chrom: "7"
          pos_grch37: 117227832
          alleles: [G, T]
      genotypes:
        GG: no_g542x
        GT: one_g542x
        TT: two_g542x
    outcomes:
      no_g542x:
        evidence: null
        summary: "No G542X copy is indicated at this marker. This is not a negative cystic fibrosis carrier screen."
        detail: >-
          G542X accounted for 2.28% of non-Hispanic white, 5.10% of Hispanic and 7.55% of
          Ashkenazi Jewish CF patient chromosomes in Watson 2004. A no-copy result here
          leaves every other CFTR allele, including F508del, unexamined.
        risk_context: >-
          Gregg 2021: CFTR carrier frequency reaches 0.041 (about 1 in 24) in the gnomAD
          population where it is highest; Scott 2010 found 1 in 23 among 8,671 fully
          Ashkenazi Jewish screenees. No residual carrier risk is computed from one marker.
      one_g542x:
        summary: "The chip pattern is consistent with one G542X copy, a cystic fibrosis-causing allele. One copy is a carrier state and does not cause cystic fibrosis."
        detail: >-
          G542X is a premature stop codon. Watson 2004 lists it in the ACMG carrier panel,
          at 2.28% of non-Hispanic white, 5.10% of Hispanic, 1.45% of African American and
          7.55% of Ashkenazi Jewish CF patient chromosomes. ClinVar classifies it pathogenic
          at practice-guideline review status.
        risk_context: >-
          If a reproductive partner also carries a CF-causing allele, each pregnancy has a 1
          in 4 chance of a child with cystic fibrosis (Mendelian expectation). Scott 2010
          observed 33 affected of 134 DNA-confirmed CF carrier-couple pregnancies. CF
          carrier frequency: up to about 1 in 24 (Gregg 2021). No partner's status is known
          here; no offspring risk is computed.
      two_g542x:
        evidence: null
        summary: "The chip pattern is consistent with two G542X copies, a cystic fibrosis genotype. A two-copy call of an allele this rare is more often a genotyping error."
        detail: >-
          Cystic fibrosis is usually diagnosed in childhood. A two-copy call in someone
          without that diagnosis is more likely a measurement problem than an unknown
          disease; only clinical testing establishes it.
        risk_context: >-
          This card assigns no penetrance or outcome estimate to a two-copy call. Every
          child of a two-copy parent inherits one G542X copy; whether a child is affected
          depends on the other parent's CFTR alleles.
    evidence:
      tier: clinical_guideline
      replication: independent
      sample_size: 37263
      ancestry: [EUR]
      effect:
        measure: proportion
        value: 0.0228
        context: "Share of non-Hispanic white CF patient chromosomes carrying G542X (Watson 2004, Table 1; CF Foundation data held 37,263 such chromosomes); a case composition, not a risk for carriers."
    citations: &cftr_citations
      - type: doi
        id: 10.1097/01.GIM.0000139506.11694.7C
        title: "Cystic fibrosis population carrier screening: 2004 revision of American College of Medical Genetics mutation panel"
        note: "Table 1: mutation frequency among clinically diagnosed CF patients by ethnic group."
      - type: doi
        id: 10.1002/humu.21327
        title: Experience with carrier screening and prenatal diagnosis for 16 Ashkenazi Jewish genetic diseases
        note: "Tables 1, 2 and 5: Ashkenazi carrier frequencies and carrier-couple pregnancy outcomes."
      - type: doi
        id: 10.1038/s41436-021-01203-z
        title: "Screening for autosomal recessive and X-linked conditions during pregnancy and preconception: a practice resource of the American College of Medical Genetics and Genomics (ACMG)"
        note: "Table 1: maximum gnomAD carrier frequency per gene."
    caveats: &cftr_caveats
      - "CF-causing alleles combine: a child with G542X from one parent and F508del or any other CF-causing allele from the other is affected. The couple-level figure applies to the gene, not to this allele alone."
      - "Ethnic-group shares describe US registry patients, not this person's ancestry."

