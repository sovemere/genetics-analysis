schema_version: 8
# M11.6: the reproductive section's section-level statement. A computed card, because its
# counts come from the carrier panel and from this run's saved carrier records; everything
# it compares them with is declared here so the comparison is reviewable as a diff.
#
# reference.genes is Gregg 2021's Tables 1-6, read row by row from the PMC author manuscript
# (PMC8488021). The published correction (PMC8776567) changes wording only: no gene, row,
# frequency or count. Condition names are as those tables print them, without MIM numbers,
# except AFF2's dated OMIM title. Docs: docs/carrier_status.md.
cards:
  - id: carrier_screening_scope
    section: reproductive
    kind: computed
    computation: carrier_screening_scope
    title: Why this section is not a carrier screen
    summary: This report's typed carrier markers, set against a published carrier-screening gene list.
    detail: >-
      A comprehensive clinical carrier screen assesses each gene's full coding region with
      its splice junctions, and uses methods such as MLPA for copy number (Gregg 2021). This
      report reads one position at each marker on a short list. Different things keep a gene
      or allele off that list, and they do not mean the same thing. An assay limit is a
      property of the data: copy number, repeat length and inversions leave no genotype call
      to read, and an indel on this array records no sequence. An allele missing from the
      array is a property of this chip. A gene or allele with no card is a gap in this
      report: no card was written, which says nothing about whether the array could support
      one, and that has not been measured gene by gene. ACMG's narrowest tier is cystic
      fibrosis and spinal muscular atrophy, and neither is screened here: F508del, about 72%
      of non-Hispanic white CF chromosomes (Watson 2004), is an indel on this array, and
      spinal muscular atrophy carrier status is a copy count. A one-copy result is not
      established by this report either, because rare chip calls are often false positives
      (Weedon 2021); each carrier card carries its own reliability tier. No detection rate
      or residual carrier risk is computed. Gregg 2021 gives residual risk as population
      carrier frequency multiplied by one minus the detection rate, and this marker set has
      no measured detection rate. G6PD is reported as a pharmacogenomic call and HFE as a
      physical-health card; neither gene is on the ACMG list.
    method_evidence:
      tier: descriptive comparison of typed markers with a published gene list; no clinical sensitivity estimate
      replication: >-
        Counting is deterministic under the recorded declaration. Weedon supports the
        chip-call limitation, not validation of these counts as a clinical screen.
      populations: ["Weedon 2021: UK Biobank participants with chip and sequencing data"]
      sample_sizes: [49908]
      measure: typed markers, conditions, ACMG Tier 3 genes by status, and this run's carrier results
      units: counts
      effect_size: No detection rate, residual carrier risk or offspring risk is estimated.
    screening_scope:
