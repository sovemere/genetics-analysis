    caveats:
      - "The ACMG list is one published reference set, chosen because it states a frequency threshold. It does not bound what could be screened: its own Tier 4 has no lower limit."
      - "Gene status does not measure coverage within a gene. A typed gene's other pathogenic alleles remain unread."
      - "The excluded alleles are what the M11.5 audit checked, not every allele this report leaves out."
      - "Gene-level assay limits name only causes with a cited source. Another gene with no card may have the same limit."
