      # Sourced gene-level limits only. A gene absent here is not thereby tractable: it has
      # no card, and whether it could have one has not been measured.
      assay_limits:
        - gene: SMN1
          mechanism: copy_number
          card: smn1_copy_number
          statement: Carrier status for spinal muscular atrophy is a copy count, which genotype calls do not carry.
        - gene: HBA1
          mechanism: copy_number
          card: alpha_globin_deletions
          statement: "Gregg 2021: most cases of alpha-thalassemia result from deletions of one or more alpha-globin genes."
        - gene: HBA2
          mechanism: copy_number
          card: alpha_globin_deletions
          statement: "Gregg 2021: most cases of alpha-thalassemia result from deletions of one or more alpha-globin genes."
        - gene: DMD
          mechanism: copy_number
          statement: "Bladen 2015: 5,682 of 7,149 recorded Duchenne mutations (80%) were deletions or duplications of at least one exon. Copy number is not in a genotype call."
        - gene: FMR1
          mechanism: repeat_expansion
          statement: "Verkerk 1991: fragile X chromosomes show length variation in the FMR1 fragment holding a CGG repeat. A genotype call does not measure repeat length."
        - gene: FXN
          mechanism: repeat_expansion
          statement: "Gregg 2021: Friedreich ataxia is associated with a GAA expansion in intron 1 of FXN. A genotype call does not measure repeat length."
        - gene: F8
          mechanism: inversion
          statement: "Antonarakis 1995: 880 of 2,093 patients with severe haemophilia A (42%) had a factor VIII inversion. An inversion is defined by breakpoints, which fall between the positions an array types."
