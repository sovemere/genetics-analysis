      two_lighter_score_alleles:
        summary: "Your {genotype} has two A alleles associated with a slightly lighter eye-color score."
        detail: >-
          The study fit an additive {effect_value}-point coefficient per A allele. Two
          copies indicate two effect alleles, not a guaranteed light-eye phenotype.
    evidence:
      tier: gwas
      replication: independent
      sample_size: 4402
      ancestry: [EUR]
      effect:
        measure: beta
        value: -0.278
        units: points per A-allele copy on a 0-to-6 eye-color scale
    citations:
      - type: doi
        id: 10.1371/journal.pgen.1000993
        title: Web-Based, Participant-Driven Studies Yield Novel Genetic Associations for Common Traits
    caveats:
      - "This marker explained about 0.8% of eye-color variance in the cited cohort and is a modifier, not a primary determinant."
      - "The result comes from self-reported eye color in northern Europeans and may not transport to other populations."
      - "A per-allele beta on an ordinal scale is not an absolute probability or a named eye color."

  - id: slc45a2_hair_shade
    section: traits
    kind: interpretation
    title: SLC45A2 hair-shade association
    gene: SLC45A2
    match:
      variants:
        - rsid: rs16891982
          chrom: "5"
          pos_grch37: 33951693
          alleles: [C, G]
      genotypes:
        CC: two_darker_score_alleles
        CG: one_darker_score_allele
        GG: no_darker_score_allele
    outcomes:
      no_darker_score_allele:
        summary: "Your {genotype} has no C allele from this darker-hair association."
        detail: >-
          In 3,044 northern-European participants without red hair, each C allele was
          associated with a {effect_value}-point shift toward the dark end of a
          self-reported 0-to-6 blond-to-black scale. No C here is not a prediction of blond hair.
      one_darker_score_allele:
        summary: "Your {genotype} has one C allele associated with a darker hair-color score."
        detail: >-
          The cited additive analysis estimated {effect_value} scale points toward darker
          hair per C allele. It is a population average across a polygenic trait, not a
          categorical prediction.
      two_darker_score_alleles:
        summary: "Your {genotype} has two C alleles associated with a darker hair-color score."
        detail: >-
          Two copies carry the study's darker-score allele, but the {effect_value}-point
          per-allele estimate should not be converted into a guaranteed hair shade.
    evidence:
      tier: gwas
      replication: independent
      sample_size: 3044
      ancestry: [EUR]
      effect:
        measure: beta
        value: 1.104
        units: points per C-allele copy on a 0-to-6 blond-to-black hair-color scale
    citations:
      - type: doi
        id: 10.1371/journal.pgen.1000993
        title: Web-Based, Participant-Driven Studies Yield Novel Genetic Associations for Common Traits
    caveats:
      - "The blond-to-brown analysis excluded red hair and used a self-reported ordinal scale."
      - "The study population was northern European, where allele frequencies and pigmentation backgrounds differ from many other ancestries."
      - "The card declares the forward-strand G/C pair evaluated by the association; other rare alleles in dbSNP are outside this array interpretation."

  - id: kitlg_blond_hair_enhancer
    section: traits
    kind: interpretation
    title: KITLG blond-hair enhancer
    gene: KITLG
    match:
      variants:
        - rsid: rs12821256
          chrom: "12"
          pos_grch37: 89328335
          alleles: [C, T]
      genotypes:
        CC: two_blond_associated_alleles
        CT: one_blond_associated_allele
        TT: no_blond_associated_allele
    outcomes:
      no_blond_associated_allele:
        summary: "Your {genotype} has no C allele from this blond-versus-brown hair association."
        detail: >-
          In the 2,986-participant European discovery cohort, each C allele was associated
          with {effect_value}-fold higher odds of blond rather than brown hair. The signal
          was then replicated in two cohorts, bringing total enrollment to 6,918. No C at
          this marker does not determine brown hair.
      one_blond_associated_allele:
        summary: "Your {genotype} has one C allele associated with higher odds of blond versus brown hair."
        detail: >-
          The cited multiplicative model reported an odds ratio of {effect_value} per C
          allele for blond versus brown hair. Functional experiments support an effect on
          a hair-follicle KITLG enhancer, but this is still not an individual probability.
      two_blond_associated_alleles:
        summary: "Your {genotype} has two C alleles associated with higher odds of blond versus brown hair."
        detail: >-
          Two copies carry the blond-associated enhancer allele. The published
          {effect_value} odds ratio is per allele and does not imply that blond hair is
          certain, because many loci contribute to hair color.
    evidence:
      tier: functional
      replication: independent
      sample_size: 2986
      ancestry: [EUR]
      effect:
        measure: odds_ratio
        value: 2.32
        ci_low: 1.86
        ci_high: 2.89
    citations:
      - type: doi
        id: 10.1038/ng.2007.13
        title: Genetic determinants of hair, eye and skin pigmentation in Europeans
        note: "Discovery OR 2.32 (95% CI 1.86-2.89), n=2,986; replicated in Icelandic n=2,718 and Dutch n=1,214 cohorts."
      - type: doi
        id: 10.1038/ng.2991
        title: A molecular basis for classic blond hair color in Europeans
    caveats:
      - "The odds ratio compares blond with brown hair in European cohorts; it is not an absolute chance of blond hair and does not cover red or black hair categories."
      - "Functional work found allele-dependent enhancer activity in keratinocytes and transgenic mice, which supports mechanism but does not make the human phenotype deterministic."
      - "Some molecular literature uses the complementary A/G representation; this card follows the forward-strand T/C study and array representation on GRCh37."

  - id: mc1r_r151c_red_hair
    section: traits
    kind: interpretation
    title: MC1R R151C and red hair
    gene: MC1R
    match:
      variants:
        - rsid: rs1805007
          chrom: "16"
          pos_grch37: 89986117
          alleles: [C, T]
      genotypes:
        CC: no_r151c_allele
        CT: one_r151c_allele
        TT: two_r151c_alleles
    outcomes:
      no_r151c_allele:
        summary: "Your {genotype} has no T allele encoding the MC1R R151C substitution."
        detail: >-
          In the cited UK Biobank analysis, each T allele had an additive odds ratio of
          {effect_value} for red rather than dark brown or black hair. No T at this one
          site does not exclude red hair or other MC1R variants.
      one_r151c_allele:
        summary: "Your {genotype} has one high-effect MC1R R151C allele associated with red hair."
        detail: >-
          The study reported {effect_value}-fold higher per-allele odds of red versus dark
          hair for T. One copy can contribute to red pigmentation, but MC1R effects are
          dose-dependent and depend strongly on the second MC1R haplotype and other loci.
      two_r151c_alleles:
        summary: "Your {genotype} has two high-effect MC1R R151C alleles associated with red hair."
        detail: >-
          Two T copies fit the high-effect MC1R pattern associated with red hair. Even so,
          the study's per-allele odds ratio is not an absolute probability and red hair is
          not guaranteed by this marker alone.
    evidence:
      tier: gwas
      replication: independent
      sample_size: 402000
      ancestry: [EUR]
      effect:
        measure: odds_ratio
        value: 12.74
    citations:
      - type: doi
        id: 10.1093/hmg/ddz018
        title: "A study in scarlet: MC1R as the main predictor of red hair and exemplar of the flip-flop effect"
    caveats:
      - "The odds ratio is from an additive single-variant model contrasting red hair with dark brown or black hair; blond and light-brown participants were excluded from that contrast."
      - "The paper reports 402,000 QC-passing UK Biobank participants, but not the exact phenotype-complete N for each red-versus-dark variant test."
      - "MC1R inheritance is dose-dependent and compound heterozygosity matters; unphased single-marker cards cannot reconstruct a complete MC1R diplotype."
      - "The card interprets the forward-strand C/T pair evaluated by the study and consumer array; other rare dbSNP alleles are out of scope."

  - id: mc1r_r160w_red_hair
    section: traits
    kind: interpretation
    title: MC1R R160W and red hair
    gene: MC1R
    match:
      variants:
        - rsid: rs1805008
          chrom: "16"
          pos_grch37: 89986144
          alleles: [C, T]
      genotypes:
        CC: no_r160w_allele
        CT: one_r160w_allele
        TT: two_r160w_alleles
    outcomes:
      no_r160w_allele:
        summary: "Your {genotype} has no T allele encoding the MC1R R160W substitution."
        detail: >-
          The cited UK Biobank model estimated an additive odds ratio of {effect_value}
          per T allele for red rather than dark brown or black hair. Absence here does not
          exclude red hair or other red-hair-associated MC1R variants.
      one_r160w_allele:
        summary: "Your {genotype} has one high-effect MC1R R160W allele associated with red hair."
        detail: >-
          One T allele carried {effect_value}-fold higher per-allele odds of red versus
          dark hair in the cited model. The result is contributory, not a standalone hair-color prediction.
      two_r160w_alleles:
        summary: "Your {genotype} has two high-effect MC1R R160W alleles associated with red hair."
        detail: >-
          Two copies fit a high-effect MC1R genotype pattern, but the published odds ratio
          remains a population comparison rather than an absolute probability for you.
    evidence:
      tier: gwas
      replication: independent
      sample_size: 402000
      ancestry: [EUR]
      effect:
        measure: odds_ratio
        value: 5.119
    citations:
      - type: doi
        id: 10.1093/hmg/ddz018
        title: "A study in scarlet: MC1R as the main predictor of red hair and exemplar of the flip-flop effect"
    caveats:
      - "The comparison was red hair versus dark brown or black hair and does not directly estimate red versus blond or light-brown hair."
      - "The reported 402,000 is the QC-passing cohort size; the source does not give a separate phenotype-complete N for this variant comparison."
      - "Two damaging MC1R alleles, including compound heterozygotes across different sites, are generally more informative than one unphased marker."
      - "The C/T genotypes were well imputed in the study (info score 1.0); other rare alleles recorded by dbSNP were not part of that model."

