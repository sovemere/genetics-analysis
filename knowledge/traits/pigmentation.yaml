schema_version: 1
cards:
  - id: herc2_oca2_eye_shade
    section: traits
    kind: interpretation
    title: HERC2/OCA2 eye-shade association
    gene: HERC2
    match:
      variants:
        - rsid: rs12913832
          chrom: "15"
          pos_grch37: 28365618
          alleles: [A, G]
      genotypes:
        AA: two_darker_score_alleles
        AG: one_darker_score_allele
        GG: no_darker_score_allele
    outcomes:
      no_darker_score_allele:
        summary: "Your {genotype} has no copy of the A allele associated with a darker eye-color score in the cited study."
        detail: >-
          In 4,402 northern-European participants, each A allele was associated with a
          {effect_value}-point shift toward the brown end of a self-reported 0-to-6
          blue-to-dark-brown scale. Having no A allele at this marker does not determine
          an eye-color category; other pigmentation variants still contribute.
      one_darker_score_allele:
        summary: "Your {genotype} has one A allele associated with a darker eye-color score."
        detail: >-
          In 4,402 northern-European participants, each A allele was associated with a
          {effect_value}-point shift toward the brown end of a self-reported 0-to-6
          blue-to-dark-brown scale. This is a population association, not a categorical
          prediction of your eye color.
      two_darker_score_alleles:
        summary: "Your {genotype} has two A alleles associated with a darker eye-color score."
        detail: >-
          The cited additive model estimated {effect_value} scale points per A allele in
          4,402 northern-European participants. The scale has a fixed upper bound and the
          estimate must not be mechanically doubled into an individual eye-color claim.
    evidence:
      tier: functional
      replication: independent
      sample_size: 4402
      ancestry: [EUR]
      effect:
        measure: beta
        value: 2.491
        units: points per A-allele copy on a 0-to-6 eye-color scale
    citations:
      - type: doi
        id: 10.1371/journal.pgen.1000993
        title: Web-Based, Participant-Driven Studies Yield Novel Genetic Associations for Common Traits
      - type: doi
        id: 10.1101/gr.128652.111
        title: HERC2 rs12913832 modulates human pigmentation by attenuating chromatin-loop formation between a long-range enhancer and the OCA2 promoter
    caveats:
      - "Eye color is polygenic; this marker alone does not determine blue, green, hazel, or brown eyes."
      - "The association used self-reported pictures and an ordinal scale in a northern-European cohort, so the numerical shift is not a physical pigment measurement and may not transfer across ancestries."
      - "Some papers report the complementary T/C strand at this locus; this card follows the forward-strand A/G study and array representation on GRCh37."

  - id: oca2_r419q_eye_shade
    section: traits
    kind: interpretation
    title: OCA2 R419Q eye-shade association
    gene: OCA2
    match:
      variants:
        - rsid: rs1800407
          chrom: "15"
          pos_grch37: 28230318
          alleles: [C, T]
      genotypes:
        CC: no_darker_score_allele
        CT: one_darker_score_allele
        TT: two_darker_score_alleles
    outcomes:
      no_darker_score_allele:
        summary: "Your {genotype} has no T allele from this eye-shade association."
        detail: >-
          In 4,402 northern-European participants, each T allele was associated with a
          {effect_value}-point shift toward the brown end of a self-reported 0-to-6 eye
          color scale. No T at this marker is not a prediction of light eyes.
      one_darker_score_allele:
        summary: "Your {genotype} has one T allele associated with a modestly darker eye-color score."
        detail: >-
          The cited additive analysis estimated a {effect_value}-point shift toward the
          brown end of the 0-to-6 scale per T allele. The result describes an average
          association and does not identify a specific eye-color category.
      two_darker_score_alleles:
        summary: "Your {genotype} has two T alleles associated with a modestly darker eye-color score."
        detail: >-
          The study estimated {effect_value} scale points per T allele, but its additive
          coefficient should not be turned into a deterministic or unbounded two-copy
          prediction for one person.
    evidence:
      tier: gwas
      replication: independent
      sample_size: 4402
      ancestry: [EUR]
      effect:
        measure: beta
        value: 0.823
        units: points per T-allele copy on a 0-to-6 eye-color scale
    citations:
      - type: doi
        id: 10.1371/journal.pgen.1000993
        title: Web-Based, Participant-Driven Studies Yield Novel Genetic Associations for Common Traits
    caveats:
      - "This effect is much smaller than the HERC2/OCA2 regulatory signal and can act as a modifier rather than a standalone predictor."
      - "The source phenotype was self-reported and the study was restricted to northern-European ancestry."
      - "The effect is a per-allele regression coefficient, not the probability of brown or intermediate eyes."

  - id: slc24a4_eye_shade
    section: traits
    kind: interpretation
    title: SLC24A4 eye-shade association
    gene: SLC24A4
    match:
      variants:
        - rsid: rs12896399
          chrom: "14"
          pos_grch37: 92773663
          alleles: [G, T]
      genotypes:
        GG: no_lighter_score_allele
        GT: one_lighter_score_allele
        TT: two_lighter_score_alleles
    outcomes:
      no_lighter_score_allele:
        summary: "Your {genotype} has no T allele from this lighter-eye association."
        detail: >-
          In 4,402 northern-European participants, each T allele was associated with a
          {effect_value}-point change on the 0-to-6 eye-color scale; the negative sign
          points toward the blue end. No T at this marker does not determine dark eyes.
      one_lighter_score_allele:
        summary: "Your {genotype} has one T allele associated with a slightly lighter eye-color score."
        detail: >-
          The cited additive study estimated {effect_value} points per T allele on a scale
          running from blue toward dark brown. The effect is small and describes a group
          average, not an individual color category.
      two_lighter_score_alleles:
        summary: "Your {genotype} has two T alleles associated with a slightly lighter eye-color score."
        detail: >-
          Two copies carry the study's lighter-score allele, but the per-allele
          {effect_value}-point coefficient is not a deterministic two-copy prediction.
    evidence:
      tier: gwas
      replication: independent
      sample_size: 4402
      ancestry: [EUR]
      effect:
        measure: beta
        value: -0.343
        units: points per T-allele copy on a 0-to-6 eye-color scale
    citations:
      - type: doi
        id: 10.1371/journal.pgen.1000993
        title: Web-Based, Participant-Driven Studies Yield Novel Genetic Associations for Common Traits
    caveats:
      - "The marker explained about 1.6% of eye-color variance in the cited cohort and should be read as a small modifier."
      - "The phenotype was self-reported and the population was northern European; direction and magnitude need not transfer unchanged to other ancestries."
      - "The card declares the forward-strand G/T pair evaluated by the association; other rare alleles in dbSNP are outside this array interpretation."

