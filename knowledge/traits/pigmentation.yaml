    outcomes:
      no_d294h_allele:
        summary: "Your {genotype} has no C allele encoding the MC1R D294H substitution."
        detail: >-
          Each C allele had an additive odds ratio of {effect_value} for red rather than
          dark brown or black hair in the cited UK Biobank analysis. No C here does not
          rule out red hair or other high-effect MC1R alleles.
      one_d294h_allele:
        summary: "Your {genotype} has one high-effect MC1R D294H allele associated with red hair."
        detail: >-
          One C allele was associated with {effect_value}-fold higher per-allele odds of
          red versus dark hair. Expression depends on the other MC1R haplotype and the
          wider pigmentation background.
      two_d294h_alleles:
        summary: "Your {genotype} has two high-effect MC1R D294H alleles associated with red hair."
        detail: >-
          Two C copies form a high-effect MC1R genotype, but the association does not make
          red hair certain and the per-allele odds ratio is not an individual risk estimate.
    evidence:
      tier: gwas
      replication: independent
      sample_size: 402000
      ancestry: [EUR]
      effect:
        measure: odds_ratio
        value: 6.658
    citations:
      - type: doi
        id: 10.1093/hmg/ddz018
        title: "A study in scarlet: MC1R as the main predictor of red hair and exemplar of the flip-flop effect"
    caveats:
      - "The odds ratio compares red hair with dark brown or black hair under an additive single-variant model."
      - "The effective QC-passing cohort numbered 402,000; exact phenotype-complete N was not reported for this variant test."
      - "This variant was imputed with an info score of 0.93 in the source, so the association estimate is not based wholly on directly typed calls."
      - "MC1R compound genotypes matter; the card interprets only the forward-strand G/C pair evaluated in the cited model."

  - id: mc1r_d84e_red_hair
    section: traits
    kind: interpretation
    title: MC1R D84E and red hair
    gene: MC1R
    match:
      variants:
        - rsid: rs1805006
          chrom: "16"
          pos_grch37: 89985918
          alleles: [A, C]
      genotypes:
        AA: two_d84e_alleles
        AC: one_d84e_allele
        CC: no_d84e_allele
    outcomes:
      no_d84e_allele:
        summary: "Your {genotype} has no A allele encoding the MC1R D84E substitution."
        detail: >-
          The cited additive model reported an odds ratio of {effect_value} per A allele
          for red rather than dark brown or black hair. Absence of this particular allele
          does not exclude red hair.
      one_d84e_allele:
        summary: "Your {genotype} has one high-effect MC1R D84E allele associated with red hair."
        detail: >-
          One A allele was associated with {effect_value}-fold higher per-allele odds of
          red versus dark hair. Because D84E is uncommon and MC1R is highly polymorphic,
          the other haplotype remains important.
      two_d84e_alleles:
        summary: "Your {genotype} has two high-effect MC1R D84E alleles associated with red hair."
        detail: >-
          Two A copies carry the high-effect substitution on both observed alleles, but
          the population odds ratio still does not make an individual phenotype certain.
    evidence:
      tier: gwas
      replication: independent
      sample_size: 402000
      ancestry: [EUR]
      effect:
        measure: odds_ratio
        value: 3.477
    citations:
      - type: doi
        id: 10.1093/hmg/ddz018
        title: "A study in scarlet: MC1R as the main predictor of red hair and exemplar of the flip-flop effect"
    caveats:
      - "The red-versus-dark comparison excluded blond and light-brown categories and therefore does not represent all non-red hair."
      - "The source reports 402,000 QC-passing participants but not the exact analytic N for each variant/phenotype contrast."
      - "D84E is uncommon; a chip call can be less reliable as population frequency falls, and confidence must be computed separately from this evidence record."
      - "Compound heterozygous MC1R genotypes require multi-variant phasing that this single-variant card does not perform."

