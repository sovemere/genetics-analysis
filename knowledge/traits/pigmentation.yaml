        id: 10.1093/hmg/ddz018
        title: "A study in scarlet: MC1R as the main predictor of red hair and exemplar of the flip-flop effect"
    caveats:
      - "The odds ratio is for red versus dark brown/black hair; it is not an absolute red-hair probability."
      - "The paper's 402,000 figure is the QC-passing cohort size, not a separately reported phenotype-complete N for this test."
      - "R142H is uncommon, so the frequency-sensitive confidence calculator should lower trust in an isolated array call even though the association itself is strong."
      - "A full MC1R interpretation needs the other allele and potentially other sites; this card is deliberately single-variant."

  - id: irf4_freckling
    section: traits
    kind: interpretation
    title: IRF4 freckling association
    gene: IRF4
    match:
      variants:
        - rsid: rs12203592
          chrom: "6"
          pos_grch37: 396321
          alleles: [C, T]
      genotypes:
        CC: no_higher_freckling_allele
        CT: one_higher_freckling_allele
        TT: two_higher_freckling_alleles
    outcomes:
      no_higher_freckling_allele:
        summary: "Your {genotype} has no T allele from this higher-freckling association."
        detail: >-
          In 4,405 northern-European participants, each T allele was associated with a
          {effect_value}-point increase on a self-reported 0-to-16 freckling score. No T
          at this marker does not mean freckles are absent.
      one_higher_freckling_allele:
        summary: "Your {genotype} has one T allele associated with a higher freckling score."
        detail: >-
          The cited additive analysis estimated {effect_value} more freckling-score points
          per T allele. Functional experiments support allele-dependent IRF4 enhancer
