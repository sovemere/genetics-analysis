# Moved from traits/sensory_metabolism.yaml at M12.1 (2026-11-08), text unchanged apart
# from `section`. A card renders in one section; these two are nutrition topics, and
# runs saved earlier keep them in traits. See docs/nutrition.md.
schema_version: 1
cards:
  - id: mcm6_lactase_persistence
    section: nutrition
    kind: interpretation
    title: Adult lactase persistence
    gene: MCM6
    match:
      variants:
        - rsid: rs4988235
          chrom: "2"
          pos_grch37: 136608646
          alleles: [A, G]
      genotypes:
        AA: persistence
        AG: persistence
        GG: non_persistence
    outcomes:
      persistence:
        summary: "Your {genotype} genotype carries the European-associated lactase-persistence allele."
        detail: >-
          The forward-strand A allele is the enhancer allele traditionally called
          -13910*T near LCT. One copy is usually sufficient to maintain higher lactase
          expression into adulthood in populations where this is the predominant
          persistence allele.
      non_persistence:
        summary: "Your {genotype} genotype is associated with adult lactase non-persistence in populations of European ancestry."
        detail: >-
          Two forward-strand G alleles correspond to -13910*C and predict the usual
          post-weaning decline in lactase expression in European-derived populations.
          This concerns enzyme persistence, not whether consuming dairy causes symptoms.
    evidence:
      tier: functional
      replication: independent
      sample_size: 236
      ancestry: [EUR, EAS]
      effect:
        measure: proportion
        value: 1.0
        context: biochemical phenotype/genotype concordance (236 of 236 participants)
    citations:
      - type: doi
        id: 10.1038/ng826
        title: Identification of a variant associated with adult-type hypolactasia
        note: Complete genotype-phenotype association in 236 biochemically phenotyped people (196 Finnish, 9 Italian, 9 German, and 22 South Korean).
      - type: doi
        id: 10.1093/hmg/ddg244
        title: "Lactase persistence DNA variant enhances lactase promoter activity in vitro: functional role as a cis regulatory element"
        note: Independent functional enhancer assay.
      - type: accession
        id: rs4988235
        database: dbSNP
        title: NCBI dbSNP Reference SNP record for rs4988235
        note: GRCh37 forward-strand coordinate and G/A alleles.
    caveats:
      - >-
        rs4988235 is an excellent marker for lactase persistence in many European-derived
        populations, but different causal enhancer variants occur in several African,
        Middle Eastern, and Central Asian populations. GG therefore does not exclude
        persistence outside the populations represented by this marker.
      - >-
        Lactase non-persistence is not identical to lactose intolerance. Symptoms depend
        on dose, food matrix, gut microbiota, adaptation, and other gastrointestinal causes.
      - >-
        Papers usually name the reverse-strand alleles -13910*C/T; this card uses GRCh37
        forward A/G, where forward A corresponds to the persistence-associated T allele.

  - id: aldh2_alcohol_flushing
    section: nutrition
    kind: interpretation
    title: Alcohol flushing tendency
    gene: ALDH2
    match:
      variants:
        - rsid: rs671
          chrom: "12"
          pos_grch37: 112241766
          alleles: [A, G]
      genotypes:
        AA: inactive
        AG: low_activity
        GG: common_activity
    outcomes:
      inactive:
        summary: "Your {genotype} genotype is associated with very low ALDH2 activity and a strong tendency to flush after alcohol."
        detail: >-
          Two A alleles encode the Lys504 low-activity form. Acetaldehyde can therefore
          accumulate rapidly after alcohol, making flushing and other unpleasant immediate
          effects much more likely. This genotype is uncommon even where the A allele occurs.
      low_activity:
        summary: "Your {genotype} genotype is associated with low ALDH2 activity and much higher odds of alcohol flushing."
        detail: >-
          One A allele encodes the dominant low-activity Lys504 form. In 2,011 Korean
          adults, each A allele was associated with 16.10-fold higher odds of reported
          alcohol flushing under an additive model.
      common_activity:
        summary: "Your {genotype} genotype carries the common active ALDH2 form and lower odds of ALDH2-related alcohol flushing."
        detail: >-
          Two G alleles encode the common Glu504 form. Flushing can still occur for other
          genetic or non-genetic reasons, but the large rs671-associated reduction in
          acetaldehyde clearance is not present.
    evidence:
      tier: functional
      replication: independent
      sample_size: 2011
      ancestry: [EAS]
      effect:
        measure: odds_ratio
        value: 16.1
        ci_low: 12.48
        ci_high: 20.77
    citations:
      - type: doi
        id: 10.1038/s41598-017-18856-z
        title: Exploring the utility of alcohol flushing as an instrumental variable for alcohol intake in Koreans
        note: "Additive rs671 A-allele association with flushing: OR 16.10, 95% CI 12.48-20.77."
      - type: doi
        id: 10.1172/JCI113875
        title: Genotypes for aldehyde dehydrogenase deficiency and alcohol sensitivity. The inactive ALDH2(2) allele is dominant
        note: Primary biochemical and dominance evidence.
      - type: accession
        id: rs671
        database: dbSNP
        title: NCBI dbSNP Reference SNP record for rs671
        note: GRCh37 forward-strand coordinate and G/A alleles.
    caveats:
      - >-
        The association and effect estimate come from an East Asian cohort; the A allele is
        commonest in East Asian populations and is rare or absent in many others.
      - >-
        Flushing is not an allergy. It reflects acetaldehyde accumulation, and its absence
        is not evidence that drinking is safe or that acetaldehyde exposure is low.
      - >-
        The study used well-imputed rather than directly genotyped rs671 calls and measured
        flushing by questionnaire, although the reported imputation information was at least 0.9.
