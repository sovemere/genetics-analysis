[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genetics-analysis"
version = "0.1.0"
description = "Offline-capable personal genome interpreter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Runtime dependencies are added per-milestone, not up front.
# See phase1_roadmap.md. Banned: pysam, cyvcf2, native bcftools/tabix
# (htslib does not run on Windows -- AGENTS.md 4.9).
dependencies = [
    "typer>=0.12",
    # M1: the normalized table. Chosen in the roadmap for speed on 677k rows and for
    # having a working Windows story -- see AGENTS.md 4.9 for why that is not incidental.
    "polars>=1.2",
    # M2: the reference manifest. Parsed with yaml.safe_load only -- see
    # genetics/refs/manifest.py. Downloads use urllib from the standard library rather
    # than `requests`: this is the project's only network code path and it would be a
    # dependency shipped forever to make an offline-first tool fetch data once.
    "pyyaml>=6.0",
    # M4.3: the local dashboard. FastAPI serves it and uvicorn runs it, both bound to
    # loopback -- see genetics/web/config.py for why that is checked rather than documented.
    # Neither is used to make an outbound request; a structural test in tests/web asserts no
    # module under genetics/web imports a network client at all.
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    # Required by fastapi.testclient, which drives the M4.3 app without opening a socket.
    # httpx2 rather than httpx: current Starlette deprecates the latter and says so on
    # every test run, and a warning nobody can act on is a warning everyone learns to skim
    # past -- including on the day it says something else.
    #
    # Listed here and not in a [dependency-groups] table (where `uv add --dev` puts it)
    # because CI installs with `uv pip install -e ".[dev]"` and would not see it there:
    # the web tests would fail on the runner and pass on every developer's machine.
    "httpx2>=2.10",
]

[project.scripts]
genetics = "genetics.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/genetics"]

[tool.hatch.build.targets.wheel.force-include]
# Cards remain top-level and reviewable in a checkout, but an installed CLI needs the
# same corpus inside its package.  default_knowledge_dir() prefers the checkout and falls
# back to this wheel path.
"knowledge" = "genetics/knowledge"

# --------------------------------------------------------------------------
# Lint
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # import sorting
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

# --------------------------------------------------------------------------
# Types
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src", "scripts", "tests"]
strict = true
warn_unreachable = true

# --------------------------------------------------------------------------
# Tests
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "privacy: leak-prevention checks; these must never be skipped",
    "slow: long-running (imputation, reference builds)",
    # Lifts the offline guard installed by tests/conftest.py. Nothing carries it today
    # and it should stay that way -- see genetics/testing/network.py (M2.7).
    "network: genuinely needs the network",
]

