[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genetics-analysis"
version = "0.1.0"
description = "Offline-capable personal genome interpreter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Runtime dependencies are added per-milestone, not up front.
# See phase1_roadmap.md. Banned: pysam, cyvcf2, native bcftools/tabix
# (htslib does not run on Windows -- AGENTS.md 4.9).
dependencies = [
    "typer>=0.12",
    # M1: the normalized table. Chosen in the roadmap for speed on 677k rows and for
    # having a working Windows story -- see AGENTS.md 4.9 for why that is not incidental.
    "polars>=1.2",
    # M2: the reference manifest. Parsed with yaml.safe_load only -- see
    # genetics/refs/manifest.py. Downloads use urllib from the standard library rather
    # than `requests`: this is the project's only network code path and it would be a
    # dependency shipped forever to make an offline-first tool fetch data once.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
genetics = "genetics.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/genetics"]

# --------------------------------------------------------------------------
# Lint
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # import sorting
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

# --------------------------------------------------------------------------
# Types
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src", "scripts", "tests"]
strict = true
warn_unreachable = true

# --------------------------------------------------------------------------
# Tests
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "privacy: leak-prevention checks; these must never be skipped",
    "slow: long-running (imputation, reference builds)",
]
