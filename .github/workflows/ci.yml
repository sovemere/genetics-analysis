name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI never touches real data and never downloads reference databases.
# It runs on synthetic fixtures only. Two reasons: reference payloads are tens of
# gigabytes, and a CI runner is the last place a genome should be.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary development platform (AGENTS.md 4.9) and Linux is
        # where anything containerised will run. Both must stay green: the htslib
        # constraint means a dependency can pass on one and fail on the other.
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      # venv + editable install rather than `uv sync`: this mirrors the local
      # development flow exactly, and there is no committed lockfile for sync to use.
      - name: Install project
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev]"

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      # dbSNP is a 28 GB fetched reference and never enters CI. This exercises every
      # card check except the explicitly reported reference lookup; full local lint fails
      # closed when the derived dbSNP index is absent.
      - name: Card pack lint (schema/templates; dbSNP unavailable in CI)
        run: uv run genetics cards lint --schema-only

      - name: Privacy suite
        run: uv run pytest -m privacy -v
        env:
          # M4.10 disables networking at the OS level with a Linux network namespace, and
          # skips with a reason where there is none -- which on Windows is the honest
          # answer, since every mechanism it offers needs elevation. Required on Linux so
          # that "covered" and "skipped everywhere, forever" stop looking identical: with
          # this set, an unavailable namespace fails the job instead of quietly passing it.
          GENETICS_REQUIRE_OS_ISOLATION: ${{ runner.os == 'Linux' && '1' || '' }}

      - name: Set up Java for synthetic Beagle acceptance
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned tools for synthetic ROH and Beagle acceptance
        run: |
          uv run genetics tools install --only plink2
          uv run genetics tools install --only plink19
          uv run genetics tools install --only beagle
          uv run genetics tools install --only bref3
          uv run genetics tools install --only unbref3
        env:
          GENETICS_DATA_DIR: ${{ runner.temp }}/genetics-native

      # The native HLA tests train synthetic HIBAG classifiers in R and impute through
      # them. They skip without HIBAG, which is how M11.2 shipped without native
      # prediction ever having run: Windows runners carry R but not HIBAG, and Linux
      # runners carry neither. R and HIBAG stay user-installed (AGENTS.md 4.9), so this
      # tracks the current release rather than a pin: a release that breaks the bridge
      # should turn CI red, because it is what a user would install. Published
      # classifiers are reference downloads and stay out of CI.
      - name: Set up R for synthetic HIBAG acceptance
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install HIBAG for synthetic HIBAG acceptance
        run: Rscript -e "install.packages('BiocManager')" -e "BiocManager::install('HIBAG', ask = FALSE, update = FALSE)" -e "library(HIBAG)"

      - name: Tests
        run: uv run pytest -q
        env:
          GENETICS_ROH_TEST_TOOLS: ${{ runner.temp }}/genetics-native/tools
          GENETICS_BEAGLE_TEST_TOOLS: ${{ runner.temp }}/genetics-native/tools
          GENETICS_REQUIRE_OS_ISOLATION: ${{ runner.os == 'Linux' && '1' || '' }}

      - name: Fixtures reproduce byte-identically
        run: uv run genetics fixtures --check

      # The R bridge keeps R's own output out of every message and leaves it in private
      # diagnostics, so a native HIBAG failure here is otherwise opaque. CI runs only
      # synthetic data, so its diagnostics are safe to print.
      - name: R diagnostics after a failure
        if: failure()
        shell: bash
        run: |
          uv run python - <<'EOF'
          from genetics.paths import cache_dir
          for log in sorted((cache_dir() / "hibag").glob("*/std*.log")):
              if log.stat().st_size:
                  print(f"== {log}")
                  print(log.read_text(encoding="utf-8", errors="replace")[-4000:])
          EOF

  no-data-in-ci:
    name: no real data present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert no raw exports or reference payloads in the checkout
        shell: bash
        run: |
          set -euo pipefail
          fail=0

          # Raw vendor exports.
          if compgen -G "AncestryDNA*.txt" > /dev/null || compgen -G "genome_*.txt" > /dev/null; then
            echo "::error::a raw DNA export is present in the checkout"
            fail=1
          fi

          # Genotype-derived artifacts anywhere in the tree.
          hits=$(find . -path ./.git -prune -o \
            \( -name '*.vcf' -o -name '*.vcf.gz' -o -name '*.bed' -o -name '*.bim' \
               -o -name '*.fam' -o -name '*.pgen' -o -name '*.eigenvec' \
               -o -name '*.sscore' -o -name '*.run.json' -o -name '*.hom' \
               -o -name '*.hom.*' -o -name '*.roh.json' -o -name '*.bref3' \
               -o -name '*.dosages.jsonl.gz' -o -iname '*.RData' -o -name '*.rda' \
               -o -name '*.rds' -o -name '*.hla-input.tsv' -o -name '*.hla-output.tsv' \
               -o -name '*.hla.json' \) -print)
          if [ -n "$hits" ]; then
            echo "::error::genotype-derived artifacts present:"
            echo "$hits"
            fail=1
          fi

          # Reference payloads must never be committed, only the manifest.
          if [ -d data/references ]; then
            payloads=$(find data/references -type f \
              ! -name 'manifest.yaml' ! -name 'manifest.lock' \
              ! -name '*.license.txt' ! -name 'CHECKSUMS' ! -name 'README.md')
            if [ -n "$payloads" ]; then
              echo "::error::reference payloads are committed; they must be fetched:"
              echo "$payloads"
              fail=1
            fi
          fi

          exit $fail
